server:
  port: ${CONTAINER_PORT:8002}
  error:
    include-message: always

spring:
  application:
    name: course-service
  # API Versioning (Spring Boot 4). Ver información en user-service
  mvc:
    api-version:
      required: true
      supported: 1,2
      use:
        path-segment: 1
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
  cloud:
    kubernetes:
      secrets:
        enable-api: true
      discovery:
        all-namespaces: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${AUTHORIZATION_SERVER_ISSUER_URI:http://localhost:9000}

custom:
  user-service:
    base-url: http://${K8S_USER_SERVICE_NAME}

logging:
  level:
    dev.magadiflo.course.app: debug
    org.hibernate.SQL: debug
